<rect x="255" y="522" width="310" height="5" fill="#71806C"/>
<text x="410" y="568" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#2B3430">Camera footage shows the</text>
<text x="410" y="594" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#2B3430">equipment stopped at 10:24.</text>

