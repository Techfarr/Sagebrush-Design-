<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#F7F0E5"/>
<rect x="95" y="54" width="1010" height="692" fill="#FFFFFF"/>
<text x="150" y="112" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#71806C">Lesson 5 of 11</text>
<text x="150" y="160" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" fill="#2B3430">Facts First — Avoiding Assumptions</text>
<rect x="150" y="186" width="94" height="6" fill="#B86448"/>
<rect x="150" y="224" width="900" height="86" fill="#F2EEE7"/>
<rect x="150" y="224" width="520" height="12" fill="#71806C"/>
<rect x="670" y="224" width="235" height="12" fill="#2B3430"/>
<rect x="905" y="224" width="145" height="12" fill="#D9C6AE"/>
<text x="182" y="273" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2B3430">Is it a Fact or Assumption?</text>
<text x="182" y="300" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#52615A">Sort each statement into the category the evidence supports.</text>

<rect x="390" y="345" width="170" height="78" fill="#EEEAE3" stroke="#D5CCBE"/>
<text x="475" y="389" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#71806C">FACT</text>
<rect x="640" y="345" width="170" height="78" fill="#EEEAE3" stroke="#D5CCBE"/>
<text x="725" y="389" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#B86448">ASSUMPTION</text>

<rect x="230" y="468" width="330" height="108" fill="#FFFFFF" stroke="#D5CCBE"/>
<rect x="230" y="468" width="330" height="5" fill="#71806C"/>
<text x="395" y="510" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">Camera footage shows the</text>
<text x="395" y="535" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">equipment stopped at 10:24.</text>

<rect x="640" y="468" width="330" height="108" fill="#FFFFFF" stroke="#D5CCBE"/>
<rect x="640" y="468" width="330" height="5" fill="#71806C"/>
<text x="805" y="510" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">The employee stated the</text>
<text x="805" y="535" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">inspection was completed.</text>

<rect x="230" y="602" width="330" height="86" fill="#FFFFFF" stroke="#D5CCBE"/>
<rect x="230" y="602" width="330" height="5" fill="#B86448"/>
<text x="395" y="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">They ignored the procedure.</text>

<rect x="640" y="602" width="330" height="86" fill="#FFFFFF" stroke="#D5CCBE"/>
<rect x="640" y="602" width="330" height="5" fill="#B86448"/>
<text x="805" y="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">The operator was careless.</text>

<text x="1018" y="718" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#71806C">Sanitized public reconstruction</text>
</svg>