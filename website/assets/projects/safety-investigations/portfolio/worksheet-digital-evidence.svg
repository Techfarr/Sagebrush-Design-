<text x="58" y="768" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#2B3430">What the footage does NOT show</text>
<text x="58" y="794" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#52615A">Camera footage captures only what is in frame. Note what is off-screen, out of view, or not recorded.</text>
<rect x="58" y="820" width="734" height="30" fill="#B86448"/>
<text x="72" y="840" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">YOUR NOTES</text>
<g stroke="#D5CCBE"><line x1="58" y1="886" x2="792" y2="886"/><line x1="58" y1="922" x2="792" y2="922"/></g>

<text x="58" y="968" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2B3430">Does the footage support, contradict, or add to what the physical evidence showed?</text>
<rect x="58" y="992" width="734" height="30" fill="#5E6D59"/>
<text x="72" y="1012" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">YOUR NOTES</text>
