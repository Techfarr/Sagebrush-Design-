<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100">
<rect width="850" height="1100" fill="#FFFFFF"/>
<rect x="40" y="35" width="770" height="1030" fill="none" stroke="#D5CCBE"/>
<text x="58" y="82" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">Safety Investigation Case Study</text>
<text x="58" y="126" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#71806C">Digital Evidence: Camera Footage</text>
<rect x="58" y="142" width="734" height="3" fill="#71806C"/>
<text x="58" y="180" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#52615A">Watch the footage all the way through once. Then watch again and log what happens and when.</text>
<text x="58" y="202" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#52615A">Note the time so your group can find each moment again.</text>

<rect x="58" y="238" width="734" height="50" fill="#5E6D59"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
<text x="74" y="268">TIME</text><text x="168" y="258">DIRECT, CIRCUMSTANTIAL,</text><text x="168" y="274">OR UNCLEAR?</text><text x="430" y="268">WHAT HAPPENS ON SCREEN</text>
</g>
<g stroke="#D5CCBE" fill="#FFFFFF">
<rect x="58" y="288" width="734" height="86"/><rect x="58" y="374" width="734" height="86"/><rect x="58" y="460" width="734" height="86"/><rect x="58" y="546" width="734" height="86"/><rect x="58" y="632" width="734" height="86"/>
