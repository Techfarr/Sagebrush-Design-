<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#D9C6AE"/>
<rect x="170" y="34" width="860" height="732" fill="#FFFFFF"/>
<text x="230" y="100" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#2B3430">Safety Investigation:</text>
<text x="230" y="147" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#2B3430">Quick Reference Guide</text>
<text x="230" y="184" font-family="Arial,Helvetica,sans-serif" font-size="16" font-style="italic" fill="#52615A">Use when an incident happens and any time you need the essentials.</text>
<text x="230" y="233" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#71806C">SHIELD: The Investigation Sequence</text>
<rect x="230" y="247" width="740" height="35" fill="#2B3430"/>
<text x="247" y="270" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Step</text>
<text x="315" y="270" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Action</text>
<text x="505" y="270" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Key point</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#2B3430">
<rect x="230" y="282" width="740" height="31" fill="#FFFFFF" stroke="#D5CCBE"/><text x="251" y="303">S</text><text x="315" y="303">Secure the Scene</text><text x="505" y="303">Protect the area and preserve what can change.</text>
<rect x="230" y="313" width="740" height="31" fill="#F8F6F1" stroke="#D5CCBE"/><text x="251" y="334">H</text><text x="315" y="334">Health Check</text><text x="505" y="334">Address employee condition before investigation work.</text>
<rect x="230" y="344" width="740" height="31" fill="#FFFFFF" stroke="#D5CCBE"/><text x="251" y="365">I</text><text x="315" y="365">Inform</text><text x="505" y="365">Notify the appropriate leader and document known facts.</text>
<rect x="230" y="375" width="740" height="31" fill="#F8F6F1" stroke="#D5CCBE"/><text x="251" y="396">E</text><text x="315" y="396">Evidence</text><text x="505" y="396">Capture physical, digital, documentary, and environmental evidence.</text>
<rect x="230" y="406" width="740" height="31" fill="#FFFFFF" stroke="#D5CCBE"/><text x="251" y="427">L</text><text x="315" y="427">Listen</text><text x="505" y="427">Interview separately. Ask open questions before closed ones.</text>
<rect x="230" y="437" width="740" height="31" fill="#F8F6F1" stroke="#D5CCBE"/><text x="251" y="458">D</text><text x="315" y="458">Document</text><text x="505" y="458">Write only what the evidence supports and update as needed.</text>
</g>
<text x="230" y="518" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#71806C">Purpose of a Safety Investigation</text>
<circle cx="247" cy="545" r="5" fill="#2B3430"/><text x="265" y="551" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2B3430">Identify causes and prevent recurrence.</text>
<circle cx="247" cy="572" r="5" fill="#2B3430"/><text x="265" y="578" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2B3430">Separate verified facts from assumptions and opinion.</text>
<circle cx="247" cy="599" r="5" fill="#2B3430"/><text x="265" y="605" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2B3430">Act as a fact-finder, not a judge.</text>
<text x="230" y="649" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#71806C">The 5 W's</text>
<text x="230" y="678" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2B3430">WHO, WHAT, WHEN, WHERE: establish the facts first.</text>
<text x="230" y="705" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2B3430">HOW: sequence and mechanics.</text>
<text x="230" y="732" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2B3430">WHY: go only as far as the evidence supports.</text>
<text x="996" y="742" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#71806C">Sanitized public reconstruction</text>
</svg>