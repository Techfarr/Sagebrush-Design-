<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100">
<rect width="850" height="1100" fill="#FFFFFF"/>
<rect x="18" y="18" width="814" height="1064" fill="none" stroke="#8B8B85" stroke-width="2"/>
<text x="78" y="100" font-family="Arial,Helvetica,sans-serif" font-size="40" fill="#2B3430">Safety Investigation:</text>
<text x="78" y="151" font-family="Arial,Helvetica,sans-serif" font-size="40" fill="#2B3430">Quick Reference Guide</text>
<text x="78" y="205" font-family="Arial,Helvetica,sans-serif" font-size="15" font-style="italic" fill="#52615A">Use when an incident happens and any time you need the essentials.</text>

<text x="78" y="262" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#71806C">SHIELD: The Investigation Sequence</text>
<rect x="78" y="275" width="694" height="34" fill="#2B3430"/>
<text x="90" y="298" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Step</text>
<text x="150" y="298" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Action</text>
<text x="332" y="298" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Key Points</text>

<g font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#2B3430">
<rect x="78" y="309" width="694" height="42" fill="#FFFFFF" stroke="#D5CCBE"/><text x="98" y="335">S</text><text x="150" y="335">Secure the Scene</text><text x="332" y="328">Freeze the scene. Address immediate hazards.</text><text x="332" y="344">Protect evidence from disturbance.</text>
<rect x="78" y="351" width="694" height="42" fill="#F8F6F1" stroke="#D5CCBE"/><text x="98" y="377">H</text><text x="150" y="377">Health Check</text><text x="332" y="370">Assess employee condition and determine care.</text><text x="332" y="386">Do not delay urgent response.</text>
<rect x="78" y="393" width="694" height="42" fill="#FFFFFF" stroke="#D5CCBE"/><text x="98" y="419">I</text><text x="150" y="419">Inform</text><text x="332" y="419">Notify the appropriate leader using known facts only.</text>
<rect x="78" y="435" width="694" height="42" fill="#F8F6F1" stroke="#D5CCBE"/><text x="98" y="461">E</text><text x="150" y="461">Evidence</text><text x="332" y="454">Capture physical, digital, documentary,</text><text x="332" y="470">testimonial, and environmental evidence.</text>
<rect x="78" y="477" width="694" height="42" fill="#FFFFFF" stroke="#D5CCBE"/><text x="98" y="503">L</text><text x="150" y="503">Listen</text><text x="332" y="496">Interview separately. Start with open questions.</text><text x="332" y="512">Document uncertainty instead of filling gaps.</text>
<rect x="78" y="519" width="694" height="42" fill="#F8F6F1" stroke="#D5CCBE"/><text x="98" y="545">D</text><text x="150" y="545">Document</text><text x="332" y="538">Write only what the evidence supports.</text><text x="332" y="554">Update the record as more is learned.</text>
</g>

<text x="78" y="620" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#71806C">Purpose of a Safety Investigation</text>
<circle cx="102" cy="651" r="5" fill="#2B3430"/><text x="120" y="657" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">Identify causes and prevent recurrence.</text>
<circle cx="102" cy="681" r="5" fill="#2B3430"/><text x="120" y="687" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">Separate verified facts from assumptions and opinion.</text>
<circle cx="102" cy="711" r="5" fill="#2B3430"/><text x="120" y="717" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">Act as a fact-finder, not a judge.</text>

<text x="78" y="773" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#71806C">The 5 W's</text>
<circle cx="102" cy="806" r="5" fill="#2B3430"/><text x="120" y="812" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">WHO, WHAT, WHEN, WHERE: establish the facts first.</text>
<circle cx="102" cy="836" r="5" fill="#2B3430"/><text x="120" y="842" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">HOW: sequence of events and mechanics.</text>
<circle cx="102" cy="866" r="5" fill="#2B3430"/><text x="120" y="872" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">WHY: go only as far as the evidence supports.</text>

<text x="78" y="930" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#71806C">Types of Evidence</text>
<circle cx="102" cy="963" r="5" fill="#2B3430"/><text x="120" y="969" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">Physical · Digital · Documentary · Testimonial · Environmental</text>
<circle cx="102" cy="993" r="5" fill="#2B3430"/><text x="120" y="999" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#2B3430">Capture perishable evidence first.</text>
<text x="772" y="1052" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#71806C">Quick Reference Guide</text>
</svg>