<text x="84" y="771" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#52615A">Quick reference + SHIELD job aids</text>
<text x="84" y="801" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#B86448">OPEN RESOURCE</text>

