<rect x="686" y="704" width="8" height="124" fill="#71806C"/>
<text x="712" y="742" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2B3430">Instant Report Template</text>
<text x="712" y="771" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#52615A">Facts-only initial communication</text>
<text x="712" y="801" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#71806C">OPEN RESOURCE</text>

<rect x="1028" y="704" width="330" height="124" fill="#FFFFFF" stroke="#D5CCBE"/>
<rect x="1028" y="704" width="8" height="124" fill="#71806C"/>
<text x="1054" y="742" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2B3430">Scene Checklist + Kit</text>
<text x="1054" y="771" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#52615A">Single-page field reference</text>
