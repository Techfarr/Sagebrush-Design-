<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#F7F0E5"/>
<rect x="0" y="0" width="1200" height="72" fill="#2B3430"/>
<text x="74" y="44" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#D9C6AE">SAFETY INVESTIGATION CASE STUDY</text>

<!-- SHIELD rail aligned evenly -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" text-anchor="middle">
<text x="690" y="43" fill="#F7F0E5">S</text><text x="770" y="43" fill="#F7F0E5">H</text><text x="850" y="43" fill="#F7F0E5">I</text><text x="930" y="43" fill="#F7F0E5">E</text><text x="1010" y="43" fill="#F7F0E5">L</text><text x="1090" y="43" fill="#F7F0E5">D</text>
</g>

<text x="74" y="128" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#B86448">SYNTHESIS</text>
<text x="74" y="178" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#2B3430">The Reframe</text>
<text x="74" y="216" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#52615A">New evidence arrives after the group has committed to an initial finding.</text>

<rect x="74" y="262" width="400" height="300" fill="#FFFFFF" stroke="#D5CCBE"/>
<rect x="74" y="262" width="400" height="8" fill="#B86448"/>
<text x="108" y="308" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#B86448">NEW EVIDENCE</text>
<text x="108" y="347" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#2B3430">Prior hazard report</text>
<text x="108" y="385" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52615A">A previous report documented a</text>
<text x="108" y="412" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52615A">restricted sightline at the same type</text>
<text x="108" y="439" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52615A">of location. The condition had not</text>
<text x="108" y="466" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#52615A">yet been corrected.</text>
<rect x="108" y="500" width="300" height="38" fill="#F2EEE7"/>
<text x="258" y="525" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#2B3430">Does this change your finding?</text>

<text x="522" y="286" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#71806C">WHERE DOES THE CAUSE SIT?</text>

<rect x="522" y="310" width="190" height="214" fill="#FFFFFF" stroke="#D5CCBE"/>
<text x="617" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2B3430">Individual</text>
<text x="617" y="388" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52615A">Actions and choices</text>
<text x="617" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52615A">of the people involved.</text>

<rect x="728" y="310" width="190" height="214" fill="#FFFFFF" stroke="#D5CCBE"/>
<text x="823" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#2B3430">Supervisory</text>
<text x="823" y="388" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52615A">What leaders knew,</text>
<text x="823" y="412" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52615A">checked, and followed up.</text>

<rect x="934" y="310" width="192" height="214" fill="#71806C"/>
<text x="1030" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Environmental</text>
<text x="1030" y="378" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">/ Systemic</text>
<text x="1030" y="418" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#F7F0E5">Conditions in the work</text>
<text x="1030" y="442" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#F7F0E5">environment and process.</text>
<text x="1030" y="480" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Known, unaddressed hazard</text>

<rect x="522" y="544" width="604" height="58" fill="#D9C6AE"/>
<text x="824" y="579" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#2B3430">Follow the evidence. Do not close the door on another explanation.</text>
<text x="1126" y="638" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#71806C">Sanitized public reconstruction of facilitated ILT</text>
</svg>